# ---------------------------------------------------------------
# GTA 6 auto-clipper config. Edit this, not the code.
# ---------------------------------------------------------------

[stream]
# Priority order: biggest streamers first. Each run clips the first [batch] max_channels that are live.
# Twitch names, or links for YouTube/Kick ("youtube.com/@name/live", "kick.com/name").
channels = [
  # first: streamers with an open GTA 6 clipping campaign (they want their streams clipped) - checked Nov 25
  "kaicenat",                 # $10k clip pool (Clipped & Shipped)
  "clix",                     # clip pool (Reach)
  "asianjeff",                # GTA 6 playthrough campaign
  "lacy",                     # own clipping program (Discord)
  # then the biggest names
  "youtube.com/@IShowSpeed/live", "ishowspeed",
  "xqc",
  "caseoh_",
  "theburntpeanut",
  "kick.com/adinross",
  "jynxzi",
  "dukedennis",
  "agent00",
  "plaqueboymax",
  "ddg",
  "thesketchreal",
  "rdcgaming",
  "zackrawrr",
  "summit1g",
  "fanum",
  "stableronaldo",
  "jasontheween",
  "yourragegaming",
  "moistcr1tikal",
  "jerma985",
  "brucedropemoff",
  "maximilian_dood",
  "tfue",
  "ninja",
  "shroud",
  "nickmercs",
  "youtube.com/@timthetatman/live",
]
max_live_recordings = 5       # record at most this many at once (~5 Mbps each)
quality = "720p,720p60,best"

[ai]
providers = ["gemini", "groq"]   # tried in order; both free. Keys go in .env
[ai.models]
# tried in order; a busy (503), rate-limited (429) or retired (404) model falls through to the next
# (gemini-4-hydrogen answers tiny tests but returns 402 Payment Required on real clips with a free key)
gemini = ["gemini-3-flash-preview", "gemini-flash-latest", "gemini-flash-lite-latest", "gemini-3.1-flash-lite", "gemini-4-hydrogen"]
groq = "llama-3.3-70b-versatile"

[signals]
# weights for the combined moment score
w_loud = 1.0
w_chat = 1.2
w_motion = 0.4
w_scene = 0.4
w_hud = 0.6
w_heat = 1.0
scene_cut_diff = 28           # frame diff (0-255) that counts as a scene cut
hud_region = [0.70, 0.02, 0.98, 0.20]   # x0,y0,x1,y1 of the HUD/wanted-stars area (fractions)

[detector]                    # live chat spikes (Twitch)
window_seconds = 10
baseline_seconds = 300
spike_multiplier = 3.0
min_weight = 25               # raise for big streamers, lower for small ones
cooldown_seconds = 90
warmup_seconds = 90
keywords = ["LUL", "KEKW", "OMEGALUL", "LMAO", "CLIP", "NO WAY", "WTF", "???", "POG", "HOLY", "DEAD", "💀", "😭", "WASTED"]
keyword_weight = 2.0

[clip]
min_len = 15
max_len = 45                  # shorter clips are watched to the end more often (the Shorts feed rewards that)
clips_per_vod = 3             # best clips kept per streamer per run
vod_candidates = 10
min_gap_seconds = 40
segment_seconds = 6
buffer_minutes = 6
live_chunk_seconds = 120      # live: run loudness/visual signals on each 2-min chunk
live_min_score = 4.0          # live: combined score needed to make a clip without a chat spike
max_clips_per_hour = 8

[edit]
layout = "auto"               # auto = streamer cam on top + gameplay below (Gemini finds the cam)
no_cam_layout = "blur-fit"    # when no cam is found: blur-fit keeps the whole frame, so the face is never cropped out
                              # (center-crop = zoomed gameplay, can cut the cam off). Other layouts: facecam-stack
width = 1080
height = 1920
crf = 21

[captions]
model = "small.en"            # tiny.en (fastest) / base.en / small.en / medium.en (best)
font_path = [                 # first one that exists is used (Mac, then server)
  "/System/Library/Fonts/Supplemental/Arial Black.ttf",
  "assets/fonts/Anton-Regular.ttf",
  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
]
font_size = 84
text_color = "#FFFFFF"
highlight_color = "#FFE600"
stroke_color = "#000000"
stroke_width = 8
max_words_per_line = 3
margin_bottom = 520
censor_words = []             # e.g. ["fuck", "shit"] -> f***, s***
vocab = "GTA 6, Vice City, Leonida, Lucia, Jason, Rockstar, wanted level, five stars, cops, heist"

[hook]
seconds = 0                   # 0 = hook banner stays the whole clip; e.g. 2.5 = first 2.5 s only
credit = true                 # small "🎥 @streamer" on screen + credit line in the description
font_size = 66
bg_color = "#FFFFFF"
text_color = "#000000"

[upload]
platforms = ["youtube"]       # any of: youtube, tiktok, instagram
youtube_privacy = "public"

[batch]                       # `python -m clipper batch` - what the scheduled GitHub Action runs
minutes = 25                  # look at the most recent N minutes of each broadcast per run (shorter = faster runs)
max_channels = 2              # channels clipped per run (first ones in the list that are live/just ended);
                              # each takes ~20 min to clip, and a run has to finish within the hour
recent_hours = 3              # only broadcasts that are live or ended within this many hours
min_new_minutes = 10          # skip a channel if fewer new minutes than this since the last run
live_record_minutes = 15      # live channels are recorded this long each run (shorter = faster runs)
only_gta = true               # only record channels whose game/title says GTA
posts_per_run = 1             # per platform per run: 13 hourly runs x 1 = 13 Shorts/day
skip_hours_after_dud = 3      # a channel whose clips were all junk (AI score 3 or less) is skipped this long
any_game_channels = ["kaicenat", "ishowspeed"]   # recorded even when not on GTA: only viral non-GTA moments
                              # (music reactions, culture, big reactions) are kept, as variety clips

[auto]                        # Gemini watches every clip and approves/rejects it - no human review
enabled = true
min_score = 7                 # 1-10; only clips Gemini scores at least this get posted. The best score is posted
                              # first, so 7 keeps the queue from running dry without lowering what goes out first
gameplay_only = true          # gameplay is the main content; clips without the game on screen are rejected...
backup_when_no_gameplay = true  # ...unless they're clearly about GTA 6 ("variety" clips: music reactions,
backup_min_score = 8          #    cultural references, viral talk). Variety clips need this AI score.
variety_every = 3             # every 3rd post may be a variety clip when one is ready (0 = only when no gameplay)
themes = ["dating", "rizz and flirting", "romance and love scenes", "couples", "relationship and therapy talk",
          "attractive characters, bikinis and beach or club scenes (suggestive, never explicit)"]
                              # clips about these are looked for first, scored higher and posted first ([] = off).
                              # Explicit sexual content and nudity are still rejected (age-restriction kills reach).
priority_channels = ["kaicenat", "clix", "asianjeff", "lacy", "ishowspeed"]   # their approved clips are posted before anyone else's
max_age_hours = 24            # approved clips older than this are not posted (last night's clips can fill the next afternoon)

[safety]
min_minutes_between_posts = 90   # spread posts out per platform
[safety.daily_caps]
youtube = 13                  # one per hourly run (YouTube API allows 100/day)
tiktok = 10
instagram = 10
# One-day exceptions (the day is counted in Pacific time, like YouTube's quota).
# Nov 19: 10 Shorts in total. 2 went up overnight before the counter was reset, so 8 more are counted here.
[safety.cap_overrides."2026-11-19"]
youtube = 8

[storage]                     # auto-delete so the server disk never fills
posted_hours = 24
rejected_hours = 6
unposted_hours = 24
vod_hours = 12

[stats]                       # views report printed at the end of each run
extra_videos = ["dKB65Q82JrA", "xx-eorqYDHE"]   # the first two Shorts, posted before the history was kept
